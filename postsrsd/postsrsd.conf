# PostSRSd: Sender Rewriting Scheme for mail that aliases forward to other providers.
#
# A forwarded message keeps its original envelope sender, so the receiving provider checks that
# sender's SPF against this server's address and fails it. Postfix asks postsrsd (through the
# canonical maps in main.cf) to rewrite such senders to SRS0=...@{{ HOSTNAME }}, a domain whose
# SPF names this server; bounces to those addresses are rewritten back to the original sender.
#
# Senders in the hosted domains never reach postsrsd: main.cf answers them from the database first.
domains = {}
srs-domain = "{{ HOSTNAME }}"
socketmap = inet:127.0.0.1:10003
keep-alive = 30
original-envelope = embedded
secrets-file = "/etc/postsrsd/postsrsd.secret"
separator = "="
hash-length = 4
hash-minimum = 4
always-rewrite = off
unprivileged-user = "postsrsd"
chroot-dir = "/var/lib/postsrsd"
syslog = off
debug = off
